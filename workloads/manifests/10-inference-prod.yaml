# Production model server. 3 replicas behind an HPA.
#
# Note MODEL_CONFIG_PATH: it points at a file that genuinely exists in the
# image. break-1 changes it to one that does not, which is why the crashloop
# in scenario 01 is a config error with a legible log line rather than an
# opaque exit code.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-api
  namespace: ml-prod
  labels:
    app: inference-api
    model: sentiment-v2
spec:
  # Keep rollout history short. On a cluster that has run the labs a dozen
  # times the approval gate's diff box otherwise fills with revision numbers
  # nobody is reading.
  revisionHistoryLimit: 5
  replicas: 3
  selector:
    matchLabels:
      app: inference-api
  template:
    metadata:
      labels:
        app: inference-api
        model: sentiment-v2
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: inference-api
          image: inference-stub:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ENVIRONMENT
              value: "prod"
            - name: MODEL_NAME
              value: "sentiment-v2"
            - name: MODEL_CONFIG_PATH
              value: "/etc/model/config.json"
            - name: LATENCY_MS
              value: "15"
            - name: ERROR_RATE
              value: "0.0"
            # These two are declared at their baseline values ONLY so that
            # `kubectl apply` can reset them. break-4 sets CPU_BURN_MS and
            # break-6 sets FEATURE_FLAGS via `kubectl set env`, which does not
            # update last-applied-configuration — so a three-way merge emits no
            # delete directive for an entry that exists only in the live object,
            # and `make reset` silently leaves the fault in place.
            #
            # This was not hypothetical: it left prod burning 250ms of CPU per
            # request permanently, so the "baseline" p95 sat at 488ms instead of
            # 24ms and scenario 04's latency step-change could never be observed.
            - name: CPU_BURN_MS
              value: "0"
            - name: FEATURE_FLAGS
              value: ""
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: inference-api
  namespace: ml-prod
  labels:
    app: inference-api
spec:
  selector:
    app: inference-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inference-api
  namespace: ml-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inference-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
