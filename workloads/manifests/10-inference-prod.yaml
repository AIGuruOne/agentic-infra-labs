# Production model server. 3 replicas behind an HPA.
#
# Note MODEL_CONFIG_PATH: it points at a file that genuinely exists in the
# image. break-1 changes it to one that does not, which is why the crashloop
# in scenario 01 is a config error with a legible log line rather than an
# opaque exit code.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-api
  namespace: ml-prod
  labels:
    app: inference-api
    model: sentiment-v2
spec:
  replicas: 3
  selector:
    matchLabels:
      app: inference-api
  template:
    metadata:
      labels:
        app: inference-api
        model: sentiment-v2
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: inference-api
          image: inference-stub:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ENVIRONMENT
              value: "prod"
            - name: MODEL_NAME
              value: "sentiment-v2"
            - name: MODEL_CONFIG_PATH
              value: "/etc/model/config.json"
            - name: LATENCY_MS
              value: "15"
            - name: ERROR_RATE
              value: "0.0"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: inference-api
  namespace: ml-prod
  labels:
    app: inference-api
spec:
  selector:
    app: inference-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inference-api
  namespace: ml-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inference-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
