# Staging model server.
#
# This is NOT a copy of prod with the replica count changed. The drift is
# deliberate and is scenario 06: older image tag (v1), a different model
# revision, higher latency budget, and a non-zero error rate that prod does not
# have. An agent asked "how is this model deployed across environments?" has to
# find all of it by diffing live specs, because no document lists it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-api
  namespace: ml-staging
  labels:
    app: inference-api
    model: sentiment-v2
spec:
  # Keep rollout history short. On a cluster that has run the labs a dozen
  # times the approval gate's diff box otherwise fills with revision numbers
  # nobody is reading.
  revisionHistoryLimit: 5
  replicas: 1
  selector:
    matchLabels:
      app: inference-api
  template:
    metadata:
      labels:
        app: inference-api
        model: sentiment-v2
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: inference-api
          image: inference-stub:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ENVIRONMENT
              value: "staging"
            - name: MODEL_NAME
              value: "sentiment-v2"
            - name: MODEL_CONFIG_PATH
              value: "/etc/model/config.json"
            - name: LATENCY_MS
              value: "40"
            - name: ERROR_RATE
              value: "0.02"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: inference-api
  namespace: ml-staging
  labels:
    app: inference-api
spec:
  selector:
    app: inference-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
